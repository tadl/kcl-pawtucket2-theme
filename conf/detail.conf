# Preserve Pawtucket's native original-media download policy and access checks.
allow_ca_objects_representation_download = anyone

detailTypes = {
	objects = {
		displayName = Newspapers,
		table = ca_objects,
		restrictToTypes = [],
		options = {
			nextLink = <i class='fa fa-angle-right' aria-hidden='true'></i><div class='small'>Next</div>,
			previousLink = <i class='fa fa-angle-left' aria-hidden='true'></i><div class='small'>Previous</div>,
			resultsLink = <i class='fa fa-angle-double-left' aria-hidden='true'></i><div class='small'>Back</div>,
			showRepresentationViewerNextPreviousLinks = 1,
			representationViewerNextLink = ^ca_objects.preferred_labels%truncate=20&ellipsis=1 <i class='fa fa-angle-right'></i>,
			representationViewerPreviousLink = <i class='fa fa-angle-left'></i> ^ca_objects.preferred_labels%truncate=20&ellipsis=1,
			enableComments = 0,
			enableShare = 0,
			enablePDF = 0,
			representationViewerPrimaryOnly = 0,
			representationViewerDontShowPlaceholder = 0,
			# The issue heading identifies the PDF; omit imported filename captions.
			representationViewerCaptionTemplate = 0,
			displayAnnotations = none,
			zoom = 1
		}
	}
}
