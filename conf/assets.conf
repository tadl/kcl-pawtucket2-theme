# Native config inheritance is disabled so KCL's scope settings win. Reuse the
# parent's runtime assets through sibling-relative links, with KCL styling last.
# main.css and fonts.css still fall back to Pawtucket's stock default theme.
minification = 0

themePackages = {
	pawtucket = {
		css = css/main.css:100,
		fonts = css/fonts.css,
		parentcss = css/tadl-theme.css:200,
		errorcss = css/error.css:210,
		accessibility = css/accessibility.css:250,
		themecss = css/theme.css:300,
		imageDownloads = js/image-downloads.js,
		userFeatures = js/user-features.js,
		lightboxOrder = js/lightbox-order.js,
		thumbnailFocus = js/thumbnail-focus.js,
		galleryNavigation = js/gallery-navigation.js,
		documentText = js/document-text.js,
		displayPreferences = js/display-preferences.js
	}
}

themeLoadSets = {
	_default = [
		pawtucket/css, pawtucket/fonts, pawtucket/parentcss,
		pawtucket/accessibility, pawtucket/themecss,
		pawtucket/imageDownloads, pawtucket/userFeatures,
		pawtucket/thumbnailFocus, pawtucket/documentText,
		pawtucket/displayPreferences
	]
}
