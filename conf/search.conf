do_highlighting = 0
defaultHitsPerBlock = 36
matchOnStem = 0

# Normal search forms target Search/objects. Retain only newspapers if a native
# MultiSearch URL is requested directly.
multisearchTypes = {
	objects = {
		displayName = Newspapers,
		table = ca_objects,
		restrictToTypes = [],
		view = Search/ca_objects_search_subview_html.php,
		itemsPerPage = 10,
		sortControlType = dropdown,
		sortBy = {
			Relevance = _natural,
			Date = ca_objects.<kcl_issue_date_element>,
			Title = ca_object_labels.name
		},
		sortDirection = {
			Relevance = asc,
			Date = asc,
			Title = asc
		},
		caption_template = "<l>^ca_objects.preferred_labels.name</l>"
	}
}

advancedSearchTypes = {}

views = {
	images = { icon = glyphicon-th },
	list = { icon = glyphicon-th-list }
}
