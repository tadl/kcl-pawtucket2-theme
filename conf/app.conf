app_display_name = Kalkaska County Library Newspaper Archive

# Pawtucket 2.0.10 loads inherited configuration after child overrides. Disable
# that merge so the KCL boundary wins; View still follows inheritFrom below.
allowThemeInheritance = 0
inheritFrom = tadl
tadl_catalogue_root_idno = kcl

# Keep native object, representation, bundle and ACL access enforcement.
dont_enforce_access_settings = 0
allow_php_in_site_page_templates = 0
use_submission_interface = 0
dontAllowRegistrationAndLogin = 1
dontAllowRegistration = 1
pawtucket_requires_login = 0
disable_lightbox = 1
use_identifiers_in_urls = 0

# Native sessions keep navigation without recording public searches in the DB.
dont_use_search_log = 1
always_use_session_based_storage_for_find_result_contexts = 1

# Keep results fresh while this collection is being imported.
disable_tadl_result_cache = 1

# This archive has no featured sets or gallery on its landing page.
front_page_set_code = 0
