cache_timeout = 0
defaultHitsPerBlock = 36
browse_menu_button_text = Browse newspapers
browseMenuFormat = list
dontPreloadBrowseMenu = 1

# These definitions replace the default theme's multi-catalogue browse types.
# The dedicated instance's public catalogue must contain only this archive;
# these display settings are not a collection-level authorization boundary.
browseTypes = {
	objects = {
		displayName = Newspapers,
		labelSingular = issue,
		labelPlural = issues,
		table = ca_objects,
		restrictToTypes = [],
		availableFacets = [decade_facet],
		views = {
			images = {},
			list = {}
		},
		sortBy = {
			Date = ca_objects.<kcl_issue_date_element>,
			Title = ca_object_labels.name,
			Relevance = _natural
		},
		sortDirection = {
			Date = asc,
			Title = asc,
			Relevance = asc
		},
		sortControlType = dropdown
	}
}

ca_objects = {
	name = Newspapers,
	facets = {
		decade_facet = {
			type = normalizedDates,
			element_code = <kcl_issue_date_element>,
			normalization = decades,
			group_mode = none,
			label_singular = decade,
			label_plural = decades
		}
	}
}

views = {
	images = { icon = glyphicon-th },
	list = { icon = glyphicon-th-list }
}
