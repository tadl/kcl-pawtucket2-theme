cache_timeout = 0
defaultHitsPerBlock = 36
browse_menu_button_text = Browse newspapers
browseMenuFormat = list
dontPreloadBrowseMenu = 1

# The parent theme supplies the catalogue-root boundary. Imported issue dates
# are ISO text, so decade links use field-bound native searches, not a
# normalizedDates facet (which requires a native date-range attribute).
browseTypes = {
	objects = {
		displayName = Newspapers,
		labelSingular = issue,
		labelPlural = issues,
		table = ca_objects,
		restrictToTypes = [],
		availableFacets = [],
		views = {
			images = {},
			list = {}
		},
		sortBy = {
			Date = ca_objects.<kcl_issue_date_element>,
			Title = ca_object_labels.name,
			Relevance = _natural
		},
		sortDirection = {
			Date = asc,
			Title = asc,
			Relevance = asc
		},
		sortControlType = dropdown
	}
}

ca_objects = {
	name = Newspapers,
	facets = {}
}

views = {
	images = { icon = glyphicon-th },
	list = { icon = glyphicon-th-list }
}
